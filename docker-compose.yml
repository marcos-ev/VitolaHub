name: charuto-app

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: charuto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: charuto
      POSTGRES_PASSWORD: charuto
      POSTGRES_DB: charuto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charuto -d charuto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: charuto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: charuto-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: charuto
      MINIO_ROOT_PASSWORD: charuto123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket de mídia automaticamente no MinIO (stand-in local do Cloudflare R2 / S3).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 charuto charuto123 &&
      mc mb -p local/charuto-media &&
      mc anonymous set download local/charuto-media &&
      exit 0
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
