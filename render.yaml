# Blueprint do Render — plano Free ($0). A API dorme após 15 min sem tráfego;
# o app mobile espera o wake (~1 min) na abertura. Não use Postgres/Redis
# do Render Free (expiram / não persistem): Neon + Upstash no dashboard.
services:
  - type: web
    name: vitola-hub-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:prod
    startCommand: npx prisma migrate deploy --schema prisma/schema.prisma && npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: WEB_APP_URL
        value: https://vitolahub.app
